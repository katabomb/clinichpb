const deptCopy={'内科':'体調の変化や日常の健康に関するご相談について，内科の立場から診療します．','呼吸器内科':'せきや息切れなど，呼吸に関わる症状についてご相談ください．','循環器内科':'心臓や血圧など，循環器に関する症状についてご相談ください．','消化器内科':'胃腸など消化器に関する症状についてご相談ください．','小児科':'お子さまの体調や健康についてご相談ください．','皮膚科':'皮膚の症状やお悩みについてご相談ください．','整形外科':'関節や筋肉，運動器に関する症状についてご相談ください．','耳鼻咽喉科':'耳・鼻・のどに関する症状についてご相談ください．','眼科':'目の症状や見え方についてご相談ください．','婦人科':'女性の健康に関するお悩みについてご相談ください．'};
let state=null, page='home', lastUrl='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function keyNorm(k){return k.replace(/[\s　・]/g,'').toLowerCase()}
function parse(raw){let d={n:'',dr:'',addr:'',tel:'',depts:[],day:null,feat:0,desc:'',notes:[],extras:[]};const map=[['n',/^(名称|医院名|診療所名|クリニック名|施設名|病院名)$/],['dr',/^(院長|院長名|代表者|医師)$/],['addr',/^(住所|所在地|所在地住所)$/],['tel',/^(電話|電話番号|tel)$/i],['depts',/^(診療科|標榜診療科|科目|診療科目)$/],['day',/^(診療日|診療曜日|診療している曜日|診療日程)$/],['closed',/^(休診|休診日|休診曜日)$/],['desc',/^(特徴|紹介|特色|理念|ひとこと)$/]];let closed='';for(const line of raw.split(/\n/)){const t=line.replace(/^[\s　\-・●■]+/,'').trim();if(!t)continue;const m=t.match(/^([^：:]{1,18})[：:]\s*(.*)$/);if(!m){d.notes.push(t);continue}const k=keyNorm(m[1]),v=m[2].trim();const hit=map.find(x=>x[1].test(k));if(hit){if(hit[0]==='depts')d.depts=v.split(/[、,，／\/・]/).map(x=>x.trim()).filter(Boolean);else if(hit[0]==='day')d.day=dayBits(v);else if(hit[0]==='closed')closed=v;else d[hit[0]]=v}else if(/駐車場|バリアフリー|予約制|初診受付|車椅子|オンライン予約|キャッシュレス|健康診断/.test(k)){let idx=features.findIndex(f=>k.includes(f));if(idx>=0){if(!/^(無|なし|不可|非対応|×|いいえ|no)$/i.test(v))d.feat|=1<<idx;else d.feat&=~(1<<idx)}}else d.extras.push([m[1].trim(),v])}if(d.day===null&&closed){d.day=127&~dayBits(closed.replace(/祝/g,''))}if(d.day!==null&&closed)d.day&=~dayBits(closed.replace(/祝/g,''));return d}
function dayBits(s){let bits=0;days.forEach((d,i)=>{if(s.includes(d))bits|=1<<i});if(/平日/.test(s))bits|=31;if(/毎日|全日/.test(s))bits=127;return bits}
function initChecks(){days.forEach((d,i)=>$('dayChecks').insertAdjacentHTML('beforeend',`<label><input type="checkbox" class="daycheck" value="${i}">${d}</label>`));features.forEach((f,i)=>$('featureChecks').insertAdjacentHTML('beforeend',`<label><input type="checkbox" class="featcheck" value="${i}">${f}</label>`))}
function updateChecks(){const d=parse($('raw').value);document.querySelectorAll('.daycheck').forEach(e=>{e.checked=d.day!==null&&!!(d.day&(1<<+e.value));e.disabled=d.day!==null});document.querySelectorAll('.featcheck').forEach(e=>{e.checked=!!(d.feat&(1<<+e.value));e.disabled=d.feat!==0});$('inputHint').textContent=d.day!==null?'診療曜日は箇条書きから読み取りました．':'診療曜日はチェック欄でも指定できます．'}
function makeData(){const d=parse($('raw').value);if(!d.n){alert('診療所名（名称：...）を入力してください．');return null}if(d.day===null){let bits=0;document.querySelectorAll('.daycheck:checked').forEach(e=>bits|=1<<+e.value);if(bits)d.day=bits}if(!d.feat)document.querySelectorAll('.featcheck:checked').forEach(e=>d.feat|=1<<+e.value);d.t=+$('theme').value<0?Math.floor(Math.random()*6):+$('theme').value;d.o=+$('tone').value;d.s=(+$('seed').value||1)%10000;return d}
function compact(d){return [1,d.n,d.dr,d.addr,d.tel,d.depts.join('、'),d.day===null?'':d.day,d.feat,d.desc,d.notes.join('\n'),d.extras,d.t,d.o,d.s]}
function expand(a){if(!Array.isArray(a)||a[0]!==1)throw Error('未対応のデータ形式');return {n:a[1]||'',dr:a[2]||'',addr:a[3]||'',tel:a[4]||'',depts:(a[5]||'').split('、').filter(Boolean),day:a[6]===''?null:+a[6],feat:+a[7]||0,desc:a[8]||'',notes:(a[9]||'').split('\n').filter(Boolean),extras:a[10]||[],t:+a[11]||0,o:+a[12]||0,s:+a[13]||1}}
function b64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){const raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function encode(d){const data=new TextEncoder().encode(JSON.stringify(compact(d)));if('CompressionStream'in window){const stream=new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64(new Uint8Array(await new Response(stream).arrayBuffer()))}return 'j'+b64(data)}
async function decode(s){const bytes=unb64(s.slice(1));let data=bytes;if(s[0]==='z'){if(!('DecompressionStream'in window))throw Error('このブラウザは圧縮URLに対応していません');data=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(s[0]!=='j')throw Error('不正なURL形式');return expand(JSON.parse(new TextDecoder().decode(data)))}
function pick(arr,offset=0){return arr[(state.s+offset)%arr.length]}
function sitePath(p){return '#site='+lastUrl.split('#site=')[1]?.split('&p=')[0]+'&p='+p}
function go(p){page=p;history.replaceState(null,'',sitePath(p));render();window.scrollTo({top:0,behavior:'smooth'})}
function links(){return [['home','ホーム'],['care','診療案内'],['doctor','院長紹介'],['about','当院について'],['visit','受診案内'],['access','アクセス']].filter(([p])=>p!=='doctor'||state.dr).filter(([p])=>p!=='access'||state.addr||state.tel)}
function cards(items){return '<div class="cards">'+items.map(([title,body])=>`<div class="card"><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`).join('')+'</div>'}
function section(title,body,cls=''){return `<section class="section ${cls}"><h2>${esc(title)}</h2>${body}</section>`}
function kv(k,v){return `<div class="kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`}
function dayView(){return state.day===null?'<p class="notice">診療曜日の詳細はお問い合わせください．</p>':'<div class="days">'+days.map((d,i)=>`<div class="day ${state.day&(1<<i)?'':'off'}">${d}<br>${state.day&(1<<i)?'○':'—'}</div>`).join('')+'</div><p class="notice">診療時刻・祝日の診療・臨時休診は，事前に直接ご確認ください．</p>'}
function featuresView(){return features.filter((f,i)=>state.feat&(1<<i)).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}
function content(){const d=state,dept=d.depts.length?d.depts:['診療内容はお問い合わせください'];const intro=intros[(d.s+d.o)%intros.length];if(page==='home')return `<div class="hero"><div class="eyebrow">WELCOME TO OUR CLINIC</div><h1>${esc(pick(texts[d.o]))}</h1><p>${esc(d.n)}${d.depts.length?'｜'+esc(d.depts.join('・')):''}<br>${esc(intro)}</p><a class="pill" href="${sitePath('care')}" data-page="care">診療のご案内 →</a></div>`+section('診療のご案内','<p class="lead">'+esc(intro)+'</p>'+cards(dept.map(x=>[x,deptCopy[x]||'診療内容については，受診前に当院へお問い合わせください．'])),'')+section('ご利用案内',dayView()+(d.tel?`<a class="pill" href="tel:${esc(d.tel.replace(/[^0-9+]/g,''))}">☎ 電話で問い合わせる</a>`:''),'stripe')+section('当院について','<p class="lead">'+esc(d.desc||'地域の皆さまの健康に寄り添う診療所を目指しています．')+'</p>'+featuresView());
if(page==='care')return `<div class="hero"><div class="eyebrow">MEDICAL SERVICES</div><h1>診療案内</h1><p>当院の診療科についてご案内します．</p></div>`+section('診療科目',cards(dept.map(x=>[x,deptCopy[x]||'詳しい診療内容は，お問い合わせください．'])))+section('ご相談について','<p class="lead">'+esc(intro)+'</p>','stripe');
if(page==='doctor')return `<div class="hero"><div class="eyebrow">GREETING</div><h1>院長紹介</h1><p>${esc(d.dr)}</p></div>`+section('院長からのご挨拶',`<p class="lead">${esc(pick(['地域の皆さまが安心してご相談できるよう，丁寧でわかりやすい診療を大切にしてまいります．','日々の健康について気になることがあれば，どうぞお気軽にご相談ください．','皆さまの健やかな毎日を支える身近な存在でありたいと考えています．'],3))}</p><p style="text-align:right">院長　${esc(d.dr)}</p>`);
if(page==='about')return `<div class="hero"><div class="eyebrow">ABOUT US</div><h1>当院について</h1><p>${esc(d.desc||intro)}</p></div>`+section('診療所概要',[kv('名称',d.n),...(d.dr?[kv('院長',d.dr)]:[]),...(d.depts.length?[kv('診療科',d.depts.join('・'))]:[]),...(d.addr?[kv('所在地',d.addr)]:[]),...(d.tel?[kv('電話',d.tel)]:[])].join(''))+(d.notes.length||d.extras.length?section('その他のご案内',cards([...d.notes.map(x=>['ご案内',x]),...d.extras])):'')+section('施設・サービス',featuresView()||'<p class="lead">設備・サービスの詳細はお問い合わせください．</p>','stripe');
if(page==='visit')return `<div class="hero"><div class="eyebrow">VISIT INFORMATION</div><h1>受診のご案内</h1><p>ご来院前にご確認ください．</p></div>`+section('診療曜日',dayView())+section('受診について','<p class="lead">初診時の受付方法，予約の要否，診療時刻については，ご来院前にお問い合わせください．</p>'+(d.tel?`<a class="pill" href="tel:${esc(d.tel.replace(/[^0-9+]/g,''))}">電話で確認する</a>`:''),'stripe');
return `<div class="hero"><div class="eyebrow">ACCESS</div><h1>アクセス</h1><p>${esc(d.n)}へのご案内</p></div>`+section('所在地・連絡先',(d.addr?kv('住所',d.addr):'')+(d.tel?kv('電話',d.tel):'')+(d.addr?`<p><a class="pill" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.addr)}" target="_blank" rel="noopener noreferrer">地図で場所を確認する ↗</a></p>`:'')+featuresView());}
function render(){if(!state)return;const site=$('site');site.className='site t'+state.t;site.innerHTML=`<header><div class="brand">✚ ${esc(state.n)}</div><nav class="nav">${links().map(([p,n])=>`<button data-page="${p}" class="${page===p?'on':''}">${n}</button>`).join('')}</nav></header><main>${content()}</main><footer><strong>${esc(state.n)}</strong><p>${esc(state.addr||'')}${state.tel?'　TEL '+esc(state.tel):''}</p><small>掲載内容は作成者の入力情報に基づきます．受診前に最新情報をご確認ください．</small></footer>`;site.querySelectorAll('[data-page]').forEach(e=>e.addEventListener('click',ev=>{ev.preventDefault();go(e.dataset.page)}));document.title=state.n+'｜診療所ホームページ'}
async function show(d,p='home'){state=d;page=p;$('editor').classList.add('hide');$('viewer').classList.remove('hide');lastUrl=location.href.split('#')[0]+'#site='+await encode(d);history.replaceState(null,'',sitePath(p));render();$('sharePanel').classList.add('hide');window.scrollTo(0,0)}
function restore(d){const lines=[`名称：${d.n}`,d.dr&&`院長：${d.dr}`,d.depts.length&&`診療科：${d.depts.join('、')}`,d.addr&&`住所：${d.addr}`,d.tel&&`電話：${d.tel}`,d.day!==null&&`診療日：${days.filter((x,i)=>d.day&(1<<i)).join('')}`,...features.filter((f,i)=>d.feat&(1<<i)).map(f=>`${f}：あり`),d.desc&&`特徴：${d.desc}`,...d.extras.map(([k,v])=>`${k}：${v}`),...d.notes].filter(Boolean);$('raw').value=lines.join('\n');$('theme').value=d.t;$('tone').value=d.o;$('seed').value=d.s;updateChecks()}
function bytesLen(s){return new TextEncoder().encode(s).length}
async function updateLen(){const d=makeData();if(!d)return;const url=location.href.split('#')[0]+'#site='+await encode(d);$('len').textContent=url.length.toLocaleString()+' / 2,000文字';$('bar').style.width=Math.min(100,url.length/2000*100)+'%';$('bar').style.background=url.length>2000?'#b85a32':'#328e78';$('lenHint').textContent=url.length>2000?'長めのURLです．自由記述を短くすることをおすすめします．':'共有用URLとして扱いやすい長さです．'}
function qrSvg(url){const utf=unescape(encodeURIComponent(url));const q=new ClinicQR(-1,1);q.addData(utf);q.make();const n=q.getModuleCount(),quiet=4,dim=n+quiet*2;let paths='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))paths+=`M${x+quiet} ${y+quiet}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges"><rect width="${dim}" height="${dim}" fill="white"/><path d="${paths}" fill="black"/></svg>`}
async function share(){const url=location.href;$('shareText').value=url;$('sharePanel').classList.remove('hide');$('qr').innerHTML='';$('qrDownload').disabled=true;const msg=$('qrMsg');if(bytesLen(url)>1800){msg.textContent='URLが長いためQRコードは生成しません．入力情報を短くすると生成できます．';return}try{$('qr').innerHTML=qrSvg(url);$('qrDownload').disabled=false;msg.textContent='規格に従って生成したQRコードです．公開前にスマートフォンで読み取りテストをしてください．'}catch(e){msg.textContent='QRコードに収まらないURLです．共有URLの文字列をコピーして利用してください．'}}
$('generate').onclick=async()=>{const d=makeData();if(d)await show(d)};$('reroll').onclick=()=>{$('seed').value=(+$('seed').value+1)%10000};$('edit').onclick=()=>{restore(state);$('viewer').classList.add('hide');$('sharePanel').classList.add('hide');$('editor').classList.remove('hide');history.replaceState(null,'',location.href.split('#')[0]);document.title='診療所ホームページメーカー';updateLen()};$('styleAgain').onclick=async()=>{state.t=(state.t+1)%6;await show(state,page)};$('textAgain').onclick=async()=>{state.s=(state.s+1)%10000;await show(state,page)};$('share').onclick=share;$('closeShare').onclick=()=>$('sharePanel').classList.add('hide');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('shareText').value);$('qrMsg').textContent='URLをコピーしました．'}catch(e){$('shareText').select();$('qrMsg').textContent='テキスト欄を選択して手動でコピーしてください．'}};$('qrDownload').onclick=()=>{const svg=$('qr').querySelector('svg');if(!svg)return;const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clinic-qr.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('raw').addEventListener('input',updateChecks);initChecks();updateChecks();(async()=>{const hash=location.hash.match(/^#site=([^&]+)(?:&p=([a-z]+))?/);if(hash){try{const d=await decode(hash[1]);await show(d,linksFor(d).includes(hash[2])?hash[2]:'home')}catch(e){alert('URLのデータを読み取れませんでした：'+e.message)}}})();function linksFor(d){return ['home','care','doctor','about','visit','access'].filter(x=>x!=='doctor'||d.dr).filter(x=>x!=='access'||d.addr||d.tel)}
</script></body></html>
